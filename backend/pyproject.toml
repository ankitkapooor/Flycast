[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flycast-backend"
version = "0.1.0"
description = "FlyCast: Drosophila connectome recurrent reservoir computing engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.12.0,<2.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "pyarrow>=15.0.0,<20.0.0",
    "polars>=0.20.0,<2.0.0",
    "gcsfs>=2024.2.0",
    "fsspec>=2024.2.0",
    "python-multipart>=0.0.9",
    "joblib>=1.3.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
